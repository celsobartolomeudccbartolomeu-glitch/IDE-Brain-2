name: Descompactar e Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar repositório
        uses: actions/checkout@v4

      - name: Extrair ficheiro ZIP do projeto
        run: |
          unzip -q "*.zip" -d projeto_extraido
          SUBPASTA=$(find projeto_extraido -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBPASTA" ]; then
            mv "$SUBPASTA"/* . 2>/dev/null || true
            mv "$SUBPASTA"/.* . 2>/dev/null || true
          else
            mv projeto_extraido/* . 2>/dev/null || true
          fi

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de Debug
        run: gradle assembleDebug

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Brain-IDE-APK
          path: app/build/outputs/apk/debug/*.apk
          
